
name: Build Shoghlak Hena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract app files
        run: unzip -o shoghlak_hena_ready.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android files
        run: flutter create . --platforms=android

      - name: Work around Android Lint crash in url_launcher
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Install packages
        run: flutter pub get

      - name: Build APK and locate output
        run: |
          set +e
          flutter build apk --release
          BUILD_STATUS=$?
          set -e

          mkdir -p build/app/outputs/flutter-apk
          APK_PATH="$(find build -type f -name '*-release.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find build -type f -name '*.apk' -print -quit)"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "No APK was generated. Build files found:"
            find build -maxdepth 8 -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit ${BUILD_STATUS:-1}
          fi

          echo "APK found at: $APK_PATH"
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shoghlak-hena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
