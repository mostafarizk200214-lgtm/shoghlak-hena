
name: Build Shoghlak Hena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract app files
        run: unzip -o shoghlak_hena_ready.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android files
        run: flutter create . --platforms=android

      - name: Install packages
        run: flutter pub get

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Find and prepare APK
        run: |
          APK_PATH="$(find . -type f -name '*.apk' -not -path './.git/*' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated."
            echo "Build outputs:"
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit 1
          fi

          DEST="build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p "$(dirname "$DEST")"

          if [ "$APK_PATH" != "$DEST" ]; then
            cp "$APK_PATH" "$DEST"
          fi

          echo "APK successfully located:"
          ls -lh "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shoghlak-hena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
